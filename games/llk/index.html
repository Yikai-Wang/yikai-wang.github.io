function myclick(myevent)

		    obj2.src=obj0.src;//"p.jpg";
		}
		//judgeHealth();
	}
	judgeHealth();

function mymin(num1,num2)
{

function shuffle() {
    var tmp = [];
    for (i = 1; i <= n; i++) {

            tempId = i * (m + 2) + j;
            tempObj = document.getElementById(tempId);
            if (tempObj.src != obj0.src) {
                tmp.push(tempObj.src)
            }
        }
    }
    for (i = 1; i <= n; i++) {
        for (j = 1; j <= m; j++) {
            tempId = i * (m + 2) + j;
            tempObj = document.getElementById(tempId);
            if (tempObj.src != obj0.src) {
               tempObj.src=tmp.splice(Math.floor(Math.random() * tmp.length),1);
            }
        }

//判断两张图片是否可以消掉
function judgeSame(o1, o2) 
{
   //两张图片必须是同样的图片    
   if(o1.src!=o2.src)
   {
        return 0;
   }
   row1=parseInt(o1.id/(m+2));
   col1=parseInt(o1.id%(m+2));
   row2=parseInt(o2.id/(m+2));
   col2=parseInt(o2.id%(m+2));
   
   obj0=document.getElementById(0);
   //判断两张图片是否可以通过某一行可达

   throughFlag = 0;
   for(row=0;row<=n+1;row++)
   {
        //两个图片都可以列到达row行，设标志位flag，=1表示可达，=0表示不可达
        flag=1;
        //第row行，列通过
        for(col=mymin(col1,col2);col<=mymax(col1,col2);col++)
        {
            if(row==row1&&col==col1)
                continue;
            if(row==row2&&col==col2)
                continue;
            //路径上的一个图片，图片的行号为row，列号为col
            cur_id=(m+2)*row+col;
            obj=document.getElementById(cur_id);
            //该位置不为空
            if(obj.src!=obj0.src)
            {flag=0;break;}
        }
        if(flag==0)
            continue;
        //第row行，1列通过
        for(row_temp = mymin(row, row1); row_temp <= mymax(row, row1); row_temp++)
        {
            if(row_temp==row1)
                continue;
            cur_id=(m+2)*row_temp+col1;
            obj=document.getElementById(cur_id);
            if(obj.src!=obj0.src)
            {flag=0;break;}
        }
        if(flag==0)
            continue;
        //第row行，2列通过
        for (row_temp = mymin(row, row2); row_temp <= mymax(row, row2); row_temp++)
        {
            if(row_temp==row2)
                continue;
            cur_id=(m+2)*row_temp+col2;
            obj=document.getElementById(cur_id);
            if(obj.src!=obj0.src)
            {flag=0;break;}
        }
        //找到一条可行路径
        if(flag==1)
        {
            throughFlag = 1;
			return 1;
            //break;
        }    
   }
   //行列转换再次判断
   col1=parseInt(o1.id/(m+2));
   row1=parseInt(o1.id%(m+2));
   col2=parseInt(o2.id/(m+2));
   row2=parseInt(o2.id%(m+2));
   for(row=0;row<=m+1;row++)
   {
        flag=1;
        for(col=mymin(col1,col2);col<=mymax(col1,col2);col++)
        {
            if(row==row1&&col==col1)
                continue;
            if(row==row2&&col==col2)
                continue;
            cur_id=(m+2)*col+row;
            obj=document.getElementById(cur_id);
            if(obj.src!=obj0.src)
            {flag=0;break;}
        }
        if(flag==0)
            continue;
        for(row_temp=mymin(row,row1);row_temp<=mymax(row,row1);row_temp++)
        {
            if(row_temp==row1)
                continue;
            cur_id=(m+2)*col1+row_temp;
            obj=document.getElementById(cur_id);
            if(obj.src!=obj0.src)
            {flag=0;break;}
        }
        if(flag==0)
            continue;
        for(row_temp=mymin(row,row2);row_temp<=mymax(row,row2);row_temp++)
        {
            if(row_temp==row2)
                continue;
            cur_id=(m+2)*col2+row_temp;
            obj=document.getElementById(cur_id);
            if(obj.src!=obj0.src)
            {flag=0;break;}
        }
        if(flag==1)
        {
            throughFlag = 1;
            return 1;
			break;
        }    
   }
   return 0;
}
function soundRespond(flagThrough)

    else
	    tempaudio=document.getElementById("audio_choral1");
    tempaudio.currentTime=0;
    tempaudio.play();
